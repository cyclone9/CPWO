name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet -tags nodynamic ./...
      - run: go test -tags nodynamic ./...
      # The release notes are this version's entry in CHANGELOG.md, kept
      # outside the checkout so GoReleaser still sees a clean tree.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '
            on && /^## / { exit }
            on { print }
            $0 == h || index($0, h " ") == 1 { on = 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
